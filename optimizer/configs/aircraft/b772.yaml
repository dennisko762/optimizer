data_quality:
  level: curated
  notes:
    - "Long-range cruise anchor comes from the hand-encoded Boeing 777-200ER GE90-94B FCOM dataset."
    - "B772 engine metadata includes GE90, PW4000-112 and Trent 800 options; only GE90-94B has a registered FCOM performance dataset today."
    - "Holding and optimum-altitude tables are also encoded from the same FCOM block."
    - "Descent profile and wind-altitude trade are still pending in the structured dataset."
    - "Cruise Mach bounds remain profile data, not hard-coded simulator logic."

notes:
  important:
    - This file is for simulator/VA optimization use, not real-world dispatch.
    - This profile lists the 777-200ER GE90, PW4000-112 and Trent 800 engine families.
    - The curated FCOM path is currently available only for the 777-200ER GE90-94B baseline.
    - Off-LRC Mach points still rely on generic OpenAP scaling around the FCOM anchor.
    - Descent and wind-altitude-trade tables are not yet wired into runtime calculations.
  sources:
    crew_regulation: EASA ORO.CC.100 one-per-50-or-fraction installed passenger seats.
    cost_model: A320 baseline scaled by MTOW/seats; replace with VA/operator-provided cost data.
    performance: Boeing 777-200ER GE90-94B FCOM PI.11.x tables plus OpenAP hybrid scaling; Boeing 777-200/-200ER/-300 ACAPS engine-option table for GE90/PW4000/Trent 800 metadata.
