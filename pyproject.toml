[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["efb-ui", "node_modules", ".venv", "dist", "build"]

[tool.ruff.lint]
# Baseline gate: syntax errors, undefined names, and real pyflakes bugs.
# The broader pyupgrade/bugbear/etc. rule families are not yet adopted
# repo-wide (531 pre-existing findings at the time this gate was added);
# ratchet this selection up in a follow-up PR rather than silently
# failing every existing PR today.
#
# F841 (unused variable) and F821 (undefined name) are excluded from
# the blocking selection for now: a one-time ruff --fix pass already
# cleared every F401 (unused import) finding, but the remaining F841
# findings touch live application logic (dead-but-maybe-intentional
# locals) and one F821 is an actual pre-existing NameError bug in
# crew_platform/routes.py:390 (`_replace_flight_icaos` undefined) —
# fixing either is an app-code change out of scope for this CI task.
# They are tracked in docs/ci-quality-gate.md and must be picked up by
# a follow-up app-code PR, then re-added here once clear.
select = ["E4", "E7", "E9", "F401", "F403", "F405", "F811", "F601", "F602", "F631", "F632", "F633", "F634", "F701", "F702", "F706", "F707"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."
exclude = [
    "efb-ui/",
    "_bak\\.py$",
    "/bak/",
    "\\.venv/",
]

[tool.coverage.run]
branch = true
source = [
    "crew_platform",
    "optimizer",
    "performance_engine",
    "strategy",
    "trajectory_engine",
    "delay_module",
    "data_fetcher",
    "sim_bridge",
    "src",
]
omit = [
    "*/tests/*",
    "*_bak.py",
    "*/.venv/*",
]

[tool.coverage.report]
skip_covered = false
show_missing = true
