# Alembic configuration for the crew platform TechLog SQLite database.
#
# The database URL is NOT stored here (and never should be): env.py resolves
# it from the environment (CREW_TECHLOG_DB_PATH / EFB_DATA_DIR) via
# crew_platform.technical.database — the same way the application does.
#
# Run from the repository root:
#   alembic -c crew_platform/technical/alembic/alembic.ini upgrade head
#   alembic -c crew_platform/technical/alembic/alembic.ini revision --autogenerate -m "..."

[alembic]
script_location = crew_platform/technical/alembic
prepend_sys_path = .

# No template extensions needed; the stock script.py.mako is sufficient.

[post_write_hooks]
# (intentionally empty — keep the dependency footprint minimal)

# Logging configuration — standard, no connection strings or credentials.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
